services:

  backup-metrics:
    image: python:3.12-slim
    container_name: backup-metrics
    working_dir: /app
    command: python metrics_exporter.py
    volumes:
      - ./metrics_exporter.py:/app/metrics_exporter.py:ro
      - ../backups:/app/backups:ro
    ports:
      - "8000:8000"
    networks:
      - monitoring
      - backup-network

  prometheus:
    image: prom/prometheus:latest
    container_name: backup-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - monitoring
    depends_on:
      - backup-metrics

  grafana:
    image: grafana/grafana:latest
    container_name: backup-grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:

  monitoring:
    driver: bridge

  backup-network:
    external: true
    name: backup-network
